name: Bug report
description: Report behavior that is broken or different from the documentation.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Luon. Remove all credentials, tokens, private
        URLs, and customer data before posting.
  - type: dropdown
    id: product
    attributes:
      label: Product
      description: Choose the closest product or layer.
      options:
        - View
        - UI
        - Act, Rule, or Style
        - CLI
        - Agent
        - WebView
        - Runtime
        - Worker or Provider
        - Core, Hub, or Gateway
        - Package or CDN
        - Templates
        - Website or documentation
        - Multiple products
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
      placeholder: Tell us what failed and what you were trying to do.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest example or exact commands that reproduce it.
      placeholder: |
        1. Run ...
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: Explain what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, architecture, Bun, CLI, and relevant package versions.
      placeholder: |
        OS: Ubuntu 24.04 AMD64
        Bun: 1.x
        Luon CLI: 0.x
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Safe logs or screenshots
      description: Optional. Redact secrets and private data before attaching anything.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing Issues for the same problem.
          required: true
        - label: I removed secrets, tokens, private URLs, and customer data.
          required: true
